{% extends 'courses/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/exercises_list.css' %}">
{% endblock %}

{% block content %}

<!-- LOADER -->
<div id="loader">
    <div class="loader-circle"></div>
    <p>جارٍ التحميل...</p>
</div>

<div class="container mt-5 content-area" style="opacity:0; transition:1s;">
    <h2 class="page-title">📘 قائمة التمارين</h2>

    <!-- فلترة -->
  <form method="get" class="filter-box fade-in">
    <input type="text" id="searchInput" placeholder="🔍 ابحث عن تمرين...">

    <label>صنف التمارين:</label>
    <select name="cat" onchange="this.form.submit()">
        <option value="">جميع التمارين</option>
        {% for c in categories %}
            <option value="{{ c.id }}"
                {% if request.GET.cat == c.id|stringformat:'s' %} selected {% endif %}
            >{{ c.name }}</option>
        {% endfor %}
    </select>
</form>

    <!-- عرض التمارين -->
    <div class="pdf-grid">
        {% for doc in docs %}
      <div class="small-pdf-item fade-item" data-title="{{ doc.title }}">
    <span class="pdf-title">{{ doc.title }}</span>

    <a href="{{ doc.file.url }}" class="download-btn" download>
        تحميل
    </a>
</div>
        {% empty %}
        <p class="text-muted">لا توجد تمارين متوفرة.</p>
        {% endfor %}
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    /* =========================
       LOADER
    ========================= */
    setTimeout(() => {
        const loader = document.getElementById("loader");
        if (loader) {
            loader.style.opacity = "0";
            setTimeout(() => loader.style.display = "none", 400);
        }
        const content = document.querySelector(".content-area");
        if (content) content.style.opacity = "1";
    }, 800);


    /* =========================
       FADE-IN ON SCROLL
    ========================= */
    const fadeItems = document.querySelectorAll(".small-pdf-item");

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add("fade-in");
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.2 });

    fadeItems.forEach(item => observer.observe(item));


    /* =========================
       LIVE SEARCH
    ========================= */
    const searchInput = document.getElementById("searchInput");
    const items = document.querySelectorAll(".fade-item");

    if (searchInput) {
        searchInput.addEventListener("keyup", function () {
            const value = this.value.toLowerCase();

            items.forEach(item => {
                const title = item.dataset.title.toLowerCase();
                item.style.display = title.includes(value) ? "block" : "none";
            });
        });
    }

});
</script>
{% endblock %}
