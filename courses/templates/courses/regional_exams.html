{% extends 'courses/base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/exams_style.css' %}">
{% endblock %}

{% block content %}
<div id="loader">
  <div class="spinner"></div>
  <p>جارٍ التحميل...</p>
</div>

<div class="container mt-5 content-area" style="opacity:0; transition:1s;">

    <h2 class="page-title">📚 الامتحانات الجهوية</h2>

    <!-- اختيار الفئة -->
    <form method="GET" class="filter-box fade-in">
      <input type="text" id="searchInput" placeholder="🔍 ابحث عن تاريخ الامتحان...">
        <label>اختر الفئة:</label>
        <select name="category"  onchange="this.form.submit()">
            {% for cat in categories %}
                <option value="{{ cat.id }}" {% if selected_category == cat.id|stringformat:'s' %}selected{% endif %}>
                    {{ cat.name }}
                </option>
            {% endfor %}
        </select>
    </form>

    <!-- عرض الملفات -->
    <div class="pdf-grid">
        {% for doc in docs %}
        <div class="small-pdf-item fade-item" data-title="{{ doc.title }}">
            <span class="pdf-title">{{ doc.title }}</span>
            <a href="{{ doc.file.url }}" class="download-btn" download>
                تحميل
                <span class="badge bg-primary float-end">{{ doc.category.name }}</span>
            </a>
        </div>
        {% empty %}
            <p class="text-muted">لا توجد امتحانات جهوية متوفرة.</p>
        {% endfor %}
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    /* ===== LOADER ===== */
    setTimeout(() => {
        const loader = document.getElementById("loader");
        if (loader) {
            loader.style.opacity = "0";
            setTimeout(() => loader.style.display = "none", 400);
        }

        const content = document.querySelector(".content-area");
        if (content) {
            content.style.opacity = "1";
        }
    }, 600);


    /* ===== FADE-IN ON SCROLL ===== */
    const items = document.querySelectorAll(".fade-item");

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add("fade-in");
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.2 });

    items.forEach(item => observer.observe(item));


    /* ===== SEARCH ===== */
    const searchInput = document.getElementById("searchInput");

    if (searchInput) {
        searchInput.addEventListener("keyup", function () {
            const value = this.value.toLowerCase();

            items.forEach(item => {
                const title = item.dataset.title.toLowerCase();
                item.style.display = title.includes(value) ? "flex" : "none";
            });
        });
    }

});
</script>
{% endblock %}
